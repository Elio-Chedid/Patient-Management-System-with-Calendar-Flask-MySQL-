<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Calendar — PhysioWay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">🩺 PhysioWay</a>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <a href="{{ url_for('index') }}"     class="btn btn-sm btn-outline-light">← Patients</a>
      <a href="{{ url_for('add_new') }}"   class="btn btn-sm btn-success">+ Add Patient</a>
      <a href="{{ url_for('analytics') }}" class="btn btn-sm btn-primary">Analytics</a>
      <a href="{{ url_for('expenses') }}"  class="btn btn-sm btn-dark">Expenses</a>
      {% if session.role=='admin' %}
        <a href="{{ url_for('manage_doctors') }}" class="btn btn-sm btn-warning">Doctors</a>
        <a href="{{ url_for('settings_view') }}"  class="btn btn-sm btn-secondary">Settings</a>
      {% endif %}
      <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light">Logout</a>
    </div>
  </div>
</nav>

<div class="container">
  <div id="calendar"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');
    var calendar   = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      height: 'auto',
      events: {{ events|tojson|safe }}
    });
    calendar.render();
  });
</script>
</body>
</html>
