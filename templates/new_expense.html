<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Add New Cost</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('index') }}">🩺 PhysioWay</a>
    <div class="d-flex flex-wrap align-items-center gap-2">
      <a href="{{ url_for('index') }}"     class="btn btn-sm btn-outline-light">← Patients</a>
      <a href="{{ url_for('expenses') }}"  class="btn btn-sm btn-dark">Expenses</a>
      <a href="{{ url_for('calendar') }}"  class="btn btn-sm btn-info">Calendar</a>
      <a href="{{ url_for('analytics') }}" class="btn btn-sm btn-primary">Analytics</a>
      {% if session.role=='admin' %}
        <a href="{{ url_for('manage_doctors') }}" class="btn btn-sm btn-warning">Doctors</a>
        <a href="{{ url_for('settings_view') }}"  class="btn btn-sm btn-secondary">Settings</a>
      {% endif %}
      <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-light">Logout</a>
    </div>
  </div>
</nav>

<div class="container">
  <h1 class="mb-4 text-dark">Add New Cost</h1>
  <form method="POST" action="{{ url_for('add_expense') }}">
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3"
                placeholder="What was the money spent on?" required></textarea>
    </div>
    <div class="row mb-3">
      <div class="col">
        <label class="form-label">Amount ($)</label>
        <input type="number" step="0.01" name="amount" class="form-control" required>
      </div>
      <div class="col">
        <label class="form-label">Date</label>
        <input type="date" name="expense_date" class="form-control"
               value="{{ today }}" required>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-dark">Save Cost</button>
      <a href="{{ url_for('expenses') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
</body>
</html>
